services:
  postgres:
    image: postgres:16-alpine
    container_name: toppers_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toppers_admin
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_DB: toppers_academy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: